[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safeanes-backend"
version = "1.0.0"
description = "Local VitalDB and pretrained-model API for SafeAnes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.54.0",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "vitaldb==1.7.2",
  "torch==2.14.1+cpu",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.setuptools.package-data]
"backend.app.ml.registry" = ["model_registry.json"]
